services:
  guardian:
    build: .
    container_name: guardian
    restart: unless-stopped
    env_file: .env
    depends_on:
      guardian-db:
        condition: service_healthy
      ollama:
        condition: service_started
      trivy:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${SSH_KEY_DIR:-~/.ssh}:/home/node/.ssh:ro
      - ./models:/app/models
      - /data:/data
      - /data/ssh-known-hosts:/home/node/.ssh/known_hosts
    networks:
      - guardian-internal
      - traefik-public
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.guardian.rule=Host(`${GUARDIAN_DOMAIN:-guardian.abnerfonseca.com.br}`)"
      - "traefik.http.routers.guardian.entrypoints=websecure"
      - "traefik.http.routers.guardian.tls.certresolver=letsencrypt"
      - "traefik.http.services.guardian.loadbalancer.server.port=3334"

  guardian-db:
    image: postgres:16-alpine
    container_name: guardian-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: guardian
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: ${GUARDIAN_DB_PASSWORD:-guardian_secret}
    volumes:
      - guardian_pgdata:/var/lib/postgresql/data
    networks:
      - guardian-internal
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: guardian-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - guardian-internal
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 12G
        reservations:
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ollama-pull:
    image: ollama/ollama:latest
    container_name: guardian-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - guardian-internal
    entrypoint: ["sh", "-c", "ollama pull ${OLLAMA_MODEL:-qwen3:4b} && ollama pull nomic-embed-text"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: "no"

  # Centralized Trivy server. Targets run `trivy image --server <url>` over SSH;
  # only this container holds the ~600MB vuln DB and refreshes it every 6h.
  # Auth via TRIVY_TOKEN (optional but recommended on shared networks).
  trivy:
    image: aquasec/trivy:latest
    container_name: guardian-trivy
    restart: unless-stopped
    command: ["server", "--listen", "0.0.0.0:4954", "--token", "${TRIVY_TOKEN:-}"]
    volumes:
      - trivy_cache:/root/.cache/trivy
    networks:
      - guardian-internal
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4954/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  guardian_pgdata:
  ollama_models:
  trivy_cache:

networks:
  guardian-internal:
    driver: bridge
  traefik-public:
    external: true
