services:
  guardian:
    build: .
    container_name: guardian
    restart: unless-stopped
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${SSH_KEY_DIR:-~/.ssh}:/home/node/.ssh:ro
    networks:
      - docker_internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=docker_internal"
      - "traefik.http.routers.guardian.rule=Host(`guardian.automabothub.com`)"
      - "traefik.http.routers.guardian.entrypoints=websecure"
      - "traefik.http.routers.guardian.tls.certresolver=letsencrypt"
      - "traefik.http.services.guardian.loadbalancer.server.port=3334"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3334/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  docker_internal:
    external: true
