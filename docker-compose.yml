services:
  guardian:
    build: .
    container_name: guardian
    restart: unless-stopped
    env_file: .env
    depends_on:
      guardian-db:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${SSH_KEY_DIR:-~/.ssh}:/home/node/.ssh:ro
    networks:
      - guardian-internal
      - traefik-public
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.guardian.rule=Host(`${GUARDIAN_DOMAIN:-guardian.localhost}`)"
      - "traefik.http.routers.guardian.entrypoints=websecure"
      - "traefik.http.routers.guardian.tls.certresolver=letsencrypt"
      - "traefik.http.services.guardian.loadbalancer.server.port=3334"

  guardian-db:
    image: postgres:16-alpine
    container_name: guardian-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: guardian
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: ${GUARDIAN_DB_PASSWORD:-guardian_secret}
    volumes:
      - guardian_pgdata:/var/lib/postgresql/data
    networks:
      - guardian-internal
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: guardian-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - guardian-internal
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 12G
        reservations:
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  ollama-pull:
    image: ollama/ollama:latest
    container_name: guardian-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - guardian-internal
    entrypoint: ["sh", "-c", "ollama pull ${OLLAMA_MODEL:-qwen3:4b} && ollama pull nomic-embed-text"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: "no"

volumes:
  guardian_pgdata:
  ollama_models:

networks:
  guardian-internal:
    driver: bridge
  traefik-public:
    external: true
